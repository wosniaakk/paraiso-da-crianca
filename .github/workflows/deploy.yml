# Publica o site no GitHub Pages a cada push na main. Não há build: os arquivos vão como estão.
# Em Settings → Pages, a fonte deve ser "GitHub Actions".
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Só os arquivos do site: deixa de fora documentação e scripts.
      - name: Separa os arquivos publicados
        run: rsync -a --exclude '.git*' --exclude 'README.md' --exclude 'PENDENCIAS.md' --exclude 'scripts' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
